name: E2E

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          {
            echo "ORCHESTRATOR_MASTER_KEY=$(openssl rand -base64 32)"
            echo "JWT_SECRET=$(openssl rand -base64 32)"
          } >> .env

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build

      - name: Wait for the dashboard
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ >/dev/null; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "dashboard did not become ready" && exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Collect logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color > docker-logs.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            playwright-report
            docker-logs.txt
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
