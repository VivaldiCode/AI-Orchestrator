<svg width="320" height="72" viewBox="0 0 320 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Orchestrator">
  <defs>
    <linearGradient id="bg2" x1="8" y1="12" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="baton2" x1="44" y1="20" x2="53" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- icon -->
  <g transform="translate(8,4)">
    <rect width="64" height="64" rx="16" fill="url(#bg2)"/>
    <g stroke="#a5b4fc" stroke-opacity="0.55" fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M46 12 a8 8 0 0 1 7 7"/>
      <path d="M45 7 a14 14 0 0 1 12 12"/>
    </g>
    <circle cx="24" cy="18" r="6" fill="#e0e7ff"/>
    <path d="M12 48 C12 33 36 33 36 48 Z" fill="#e0e7ff"/>
    <path d="M30 40 L44 20" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round"/>
    <path d="M44 20 L52 9" stroke="url(#baton2)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="52.5" cy="8.5" r="2.6" fill="#fde68a"/>
    <g stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.2">
      <line x1="18" y1="54" x2="32" y2="54"/>
      <line x1="32" y1="54" x2="46" y2="54"/>
    </g>
    <g fill="#fbbf24">
      <circle cx="18" cy="54" r="2.4"/>
      <circle cx="32" cy="54" r="2.4"/>
      <circle cx="46" cy="54" r="2.4"/>
    </g>
  </g>

  <!-- wordmark (indigo reads on both light and dark backgrounds) -->
  <text x="88" y="38" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#4f46e5">AI Orchestrator</text>
  <text x="89" y="56" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="0.5" fill="#64748b">conduct your LLM fleet</text>
</svg>
