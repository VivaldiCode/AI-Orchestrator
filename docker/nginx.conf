server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (the API sets its own via Helmet).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 20m;

  # Marketing landing page.
  location /landing/ {
    alias /usr/share/nginx/html/landing/;
    try_files $uri $uri/ /landing/index.html;
  }

  # Management API → orchestrator.
  location /admin/ {
    proxy_pass http://api:11435;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Inference: the Ollama mirror (/api/*) and the OpenAI-compatible surface
  # (/v1/*) → orchestrator. These are the drop-in endpoints, so the single web
  # port works as a full Ollama/OpenAI replacement. Responses stream (NDJSON /
  # SSE), so disable buffering and allow long-running generations.
  location /api/ {
    proxy_pass http://api:11435;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location /v1/ {
    proxy_pass http://api:11435;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location = /healthz {
    proxy_pass http://api:11435/healthz;
  }

  # Realtime WebSocket.
  location /ws {
    proxy_pass http://api:11435;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # API docs (Swagger UI + OpenAPI spec) → orchestrator.
  location /docs {
    proxy_pass http://api:11435;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /openapi.json {
    proxy_pass http://api:11435/openapi.json;
  }

  # Content-hashed build assets (filename changes every build) → cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Dashboard SPA (client-side routing fallback). index.html must NOT be cached,
  # or browsers keep serving a stale shell that points at old asset hashes — so a
  # redeploy isn't visible until a manual hard-refresh. ETag still gives cheap
  # 304 revalidation.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
