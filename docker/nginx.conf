server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (the API sets its own via Helmet).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 20m;

  # Marketing landing page.
  location /landing/ {
    alias /usr/share/nginx/html/landing/;
    try_files $uri $uri/ /landing/index.html;
  }

  # Management API → orchestrator.
  location /admin/ {
    proxy_pass http://api:11435;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location = /healthz {
    proxy_pass http://api:11435/healthz;
  }

  # Realtime WebSocket.
  location /ws {
    proxy_pass http://api:11435;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Dashboard SPA (client-side routing fallback).
  location / {
    try_files $uri /index.html;
  }
}
